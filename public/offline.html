<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Creator Connect — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080a13;color:#f8fafc;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:24px}
    .card{max-width:520px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);border-radius:28px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.35)}
    h1{font-size:clamp(2rem,6vw,3.8rem);line-height:.95;letter-spacing:-.06em;margin:0 0 14px}.muted{color:#a1a8b8;line-height:1.6}.logo{width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#a855f7,#ec4899);display:grid;place-items:center;font-weight:900;margin-bottom:18px}.btn{display:inline-block;margin-top:18px;color:white;text-decoration:none;background:linear-gradient(135deg,#a855f7,#ec4899);border-radius:999px;padding:12px 16px;font-weight:850}
  </style>
</head>
<body><main class="card"><div class="logo">✦</div><h1>You are offline</h1><p class="muted">Creator Connect is installed, but this page needs a network connection. Reconnect and try again.</p><a class="btn" href="/">Retry</a></main></body>
</html>
